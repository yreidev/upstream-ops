name: Publish Docker Image

# 触发：
#   - 推送形如 v0.0.1 的 git tag    → 发 :v0.0.1 + :0.0 + :latest
#   - 手动触发                      → 可填自定义 tag
# 推送 main 分支不构建镜像，只由 ci.yml 跑测试；这里构建前也会先跑一遍 ci.yml。
# 推 tag 时还会取 docs/CHANGELOG.md 里这个版本的段落创建 GitHub Release，没写这个版本就不构建。
#
# 所有构建都附带一个 :sha-xxxxxxx 短 hash tag，方便回滚到任意 commit。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '额外推送的镜像 tag（可选，如 dev-test）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

# 同一分支或 tag 有新的推送时，取消还没跑完的旧构建。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # actions/checkout 会先 git init，没设默认分支名时 git 每次都打印一段 hint；按 git 的提示把默认分支设成 main。
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 发版前确认更新日志里写了这个版本，漏写就在构建镜像前失败。
      - name: Check changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 用 GITHUB_TOKEN 登录 ghcr.io，不需要额外配 secret。
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据触发场景自动算 tag：semver tag → v0.0.1 / 0.0 / latest；
      # 任何场景都额外加一个 sha-xxxxxxx 作为不可变快照。
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      # 只构建 amd64（部署的 k3s 是 amd64）。arm64 要靠 QEMU 模拟编译，单次就要几十分钟，所以不构建。
      # GitHub Actions 内置 cache (type=gha) 会缓存前端 pnpm install 和后端 go mod download。
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Pushed images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # 用 docs/CHANGELOG.md 里这个版本的段落创建 GitHub Release，末尾附上镜像地址和 digest。
  # 同一个 tag 重新跑时改为更新已有的 Release。
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          {
            echo
            echo '### 镜像'
            echo
            echo '```'
            echo "${IMAGE}:${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
