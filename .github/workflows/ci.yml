name: CI

# 触发：
#   - 推送到 main 分支        → 只跑测试，不构建镜像
#   - 被 publish.yml 调用     → 推版本 tag 构建镜像前先跑一遍
#   - 手动触发
on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# actions/checkout 会先 git init，没设默认分支名时 git 每次都打印一段 hint；按 git 的提示把默认分支设成 main。
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  backend:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 Dockerfile 的 golang 镜像保持一致；默认按 go.sum 缓存模块。
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l backend cmd web)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt：" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 版本取 package.json 的 packageManager。
      # 写死 v6.1.0：浮动的 v6 标签还停在 v6.0.10，先装 pnpm 11 再自升级到 12，每次都报一条
      # “Detected a pnpm v10 installation layout” 的误报（pnpm/action-setup#281）；v6.1.0 直接装 pnpm 12，没有这条。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      # 与 Dockerfile 的 node 镜像保持一致。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
